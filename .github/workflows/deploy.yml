name: Validate, build, and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Validate generated geography
        run: npm run data:validate
      - name: Build GitHub Pages bundle
        run: npm run build
        env:
          VITE_BATTLE_API_URL: ${{ vars.BATTLE_API_URL }}
      - name: Validate Cloudflare Worker bundle
        run: npm run build:worker
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Responsive browser tests
        run: npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
